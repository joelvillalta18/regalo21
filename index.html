
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#020713">
    <meta name="description" content="Un corazón azul formado por partículas luminosas, creado especialmente para ti.">

    <meta name="author" content="Joel">
    <meta name="color-scheme" content="dark">

    <title>Un corazón para ti 💙</title>

    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Estilos -->
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <main class="escena">

        <!-- Fondo animado -->
        <canvas
            id="canvas"
            aria-hidden="true">
        </canvas>

        <!-- Contenido principal -->
        <section class="mensaje" aria-labelledby="titulo">

            <span class="subtitulo">UN DETALLE ESPECIAL</span>

            <h1 id="titulo">
                Un corazón para ti <span aria-hidden="true">💙</span>
            </h1>

            <p>
                Hecho de pequeñas luces,
                como mis recuerdos contigo.
            </p>

            <div class="decoracion" aria-hidden="true">
                ✦ ✧ ✦
            </div>

        </section>

        <!-- Pie de página -->
        <footer class="pie">
            <p>Hecho con cariño 💙</p>
        </footer>

    </main>

    <!-- Animación -->
    <script src="index.js" defer></script>

</body>
</html>
